<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#895B3E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="2 Sets">
  <title>2 Sets</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/inicio" aria-label="2 Sets, inicio">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="4" y="9" width="40" height="4" rx="1" fill="currentColor"/>
        <rect x="6" y="35" width="36" height="4" rx="1" fill="currentColor"/>
        <rect x="9" y="13" width="5" height="22" fill="currentColor"/>
        <rect x="34" y="13" width="5" height="22" fill="currentColor"/>
        <text x="24" y="31" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-weight="600" fill="currentColor">II</text>
      </svg>
      <span class="brand-name">2 SETS</span>
    </a>
  </header>

  <main id="screen" class="screen"></main>

  <nav class="tabs" aria-label="Secciones">
    <a href="#/inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></svg><span>Inicio</span></a>
    <a href="#/entrenar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10h3v4H2zm17 0h3v4h-3zM6 7h3v10H6zm9 0h3v10h-3zM9 11h6v2H9z"/></svg><span>Entrenar</span></a>
    <a href="#/historial"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zm2 4v10h12V8zm2 2h8v2H8zm0 4h5v2H8z"/></svg><span>Historial</span></a>
    <a href="#/progreso"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18v-2H5V4H3zm5-4 4-5 3 3 6-8-1.5-1.2L15 11l-3-3-5.5 6.8z"/></svg><span>Progreso</span></a>
    <a href="#/ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 4-2.2-.6-.5-1.3 1.2-2-2.6-2.6-2 1.2-1.3-.5L13 3h-2l-.6 2.2-1.3.5-2-1.2L4.5 7.1l1.2 2-.5 1.3L3 11v2l2.2.6.5 1.3-1.2 2 2.6 2.6 2-1.2 1.3.5L11 21h2l.6-2.2 1.3-.5 2 1.2 2.6-2.6-1.2-2 .5-1.3L21 13z"/></svg><span>Ajustes</span></a>
  </nav>

  <button id="timer-pill" class="timer-pill" type="button" aria-label="Abrir el temporizador">⏱ Temporizador</button>

  <div id="rest-overlay" class="timer-sheet" role="dialog" aria-label="Temporizador" hidden>
    <p class="label-caps">Temporizador</p>
    <h2 id="rest-title">Elegí el tiempo</h2>
    <div id="rest-time" class="rest-time">05:00</div>
    <div class="presets">
      <button type="button" class="seg-btn" data-preset="60">1 min</button>
      <button type="button" class="seg-btn" data-preset="120">2 min</button>
      <button type="button" class="seg-btn" data-preset="180">3 min</button>
      <button type="button" class="seg-btn" data-preset="240">4 min</button>
      <button type="button" class="seg-btn" data-preset="300">5 min</button>
      <button type="button" class="seg-btn" data-preset="420">7 min</button>
      <button type="button" class="seg-btn" data-preset="600">10 min</button>
    </div>
    <div class="rest-actions">
      <button id="rest-minus" class="btn btn-ghost btn-dark" type="button">−30 s</button>
      <button id="rest-start" class="btn btn-primary" type="button">Iniciar</button>
      <button id="rest-plus" class="btn btn-ghost btn-dark" type="button">+30 s</button>
    </div>
    <div class="rest-actions">
      <button id="rest-reset" class="btn btn-ghost btn-dark btn-sm" type="button">Reiniciar</button>
      <button id="rest-skip" class="btn btn-ghost btn-dark btn-sm" type="button">Cerrar</button>
    </div>
    <p id="rest-status" class="rest-status"></p>
    <button id="rest-notify" class="btn btn-ghost btn-dark btn-sm" type="button" hidden>Activar notificaciones</button>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
